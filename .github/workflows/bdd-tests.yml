name: Cucumber BDD

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bdd
      - name: Upload BDD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-artifacts
          path: |
            reports/cucumber-results.json
            test-results/bdd/
          if-no-files-found: warn
          retention-days: 14
