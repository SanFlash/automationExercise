name: Playwright quality, full validation and animated report

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate:config
      - run: npm run lint
      - name: Apply canonical formatting
        run: npm run format
      - name: Verify formatting
        run: npm run format:check

  full-validation:
    name: Full UI, API, BDD validation and report
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install all Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate configuration
        run: npm run validate:config
      - name: Run full UI regression on Chromium
        id: ui
        continue-on-error: true
        run: npm run test:regression -- --project=chromium
      - name: Preserve UI suite results
        if: always()
        run: if [ -f reports/results.json ]; then cp reports/results.json reports/ui-results.json; fi
      - name: Run API contract suite
        id: api
        continue-on-error: true
        run: npm run test:api -- --project=chromium
      - name: Preserve API suite results
        if: always()
        run: if [ -f reports/results.json ]; then cp reports/results.json reports/api-results.json; fi
      - name: Run Cucumber BDD suite
        id: bdd
        continue-on-error: true
        run: npm run test:bdd
      - name: Generate animated report dashboard
        if: always()
        run: node scripts/generate-animated-report.js
      - name: Publish clickable report links in Actions summary
        if: always()
        env:
          UI_RESULT: ${{ steps.ui.outcome }}
          API_RESULT: ${{ steps.api.outcome }}
          BDD_RESULT: ${{ steps.bdd.outcome }}
        run: |
          {
            echo "# ◈ Sentinel QA — Full Validation Report"
            echo ""
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| UI regression (Chromium CI gate) | ${UI_RESULT} |"
            echo "| API contract | ${API_RESULT} |"
            echo "| Cucumber BDD | ${BDD_RESULT} |"
            echo ""
            echo "## Open the report"
            echo "- [Open this workflow run and download the **Animated HTML Report** artifact](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "GitHub Pages publishing is optional and may be unavailable until enabled in repository Settings → Pages. The downloadable animated report artifact is the reliable fallback for every run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload animated dashboard and test evidence
        if: always()
        id: report-artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-playwright-report-${{ github.run_id }}
          path: |
            reports/dashboard/
            reports/html/
            reports/results.json
            reports/ui-results.json
            reports/api-results.json
            reports/junit.xml
            reports/cucumber-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Add direct artifact link to workflow summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "## Direct report download"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[**Download/open the Animated Playwright Report artifact**]($ARTIFACT_URL)"
            else
              echo "The artifact URL was not returned by GitHub. Open the run's Artifacts section to download the report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail workflow if any test suite failed
        if: always()
        env:
          UI_RESULT: ${{ steps.ui.outcome }}
          API_RESULT: ${{ steps.api.outcome }}
          BDD_RESULT: ${{ steps.bdd.outcome }}
        run: |
          if [ "$UI_RESULT" != "success" ] || [ "$API_RESULT" != "success" ] || [ "$BDD_RESULT" != "success" ]; then
            echo "One or more suites failed. Inspect the report and evidence artifacts."
            exit 1
          fi
